name: TXF Realtime Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * 1-6'

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 下載監控程式
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝連線套件
        run: pip install requests

      - name: 執行台指期監控
        run: python txf_alert.py
